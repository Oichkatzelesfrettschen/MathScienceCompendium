services:
  mineru:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINERU_VERSION: "3.4.4"
    image: mathscience-mineru:3.4.4
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
