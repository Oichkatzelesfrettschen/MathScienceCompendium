services:
  mineru:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MINERU_VERSION: "3.4.4"
    image: mathscience-mineru:3.4.4
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      MINERU_HYBRID_BATCH_RATIO: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
