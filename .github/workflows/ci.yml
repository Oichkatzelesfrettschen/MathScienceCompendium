name: CI - Comprehensive Quality Assurance

on:
  push:
    branches: [main, develop, "copilot/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint, format, types, and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,lint]"

      - name: Run Ruff
        run: make lint

      - name: Verify Ruff formatting
        run: ruff format --check src tests benchmarks experiments scripts

      - name: Run strict type checks
        run: make check-types

      - name: Run Bandit
        run: bandit -r src -q

  test:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: >-
          pytest tests -v
          --cov=src/mathphysics
          --cov-report=xml
          --cov-report=term
          --cov-report=html

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: Claims and reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install evidence dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate reproducibility surfaces
        run: make repro-refresh

      - name: Verify generated evidence is committed
        run: git diff --exit-code

      - name: Run claim falsification gates
        run: python scripts/run_claim_gates.py

      - name: Verify offline integrity
        run: make verify-offline

      - name: Upload reproducibility indexes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-indexes
          path: |
            data/registry/claim_gate_results.json
            data/registry/claim_coverage_report.toml
            data/registry/docs_index.toml
            data/registry/corpus_dedupe_report.toml
            docs/DOCS_INDEX.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        run: python -m build

      - name: Validate package
        run: twine check --strict dist/*

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  quality-summary:
    name: Quality summary
    runs-on: ubuntu-latest
    needs: [lint, test, evidence, build]
    if: always()
    steps:
      - name: Report required job results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          {
            echo "## CI Quality Summary"
            echo
            echo "Lint: ${LINT_RESULT}"
            echo "Tests: ${TEST_RESULT}"
            echo "Evidence: ${EVIDENCE_RESULT}"
            echo "Build: ${BUILD_RESULT}"
          } >> "${GITHUB_STEP_SUMMARY}"
          test "${LINT_RESULT}" = success
          test "${TEST_RESULT}" = success
          test "${EVIDENCE_RESULT}" = success
          test "${BUILD_RESULT}" = success
