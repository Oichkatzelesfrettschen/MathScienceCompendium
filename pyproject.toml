[build-system]
requires = ["setuptools>=77.0,<81.0", "wheel>=0.45,<1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mathphysics-compendium"
version = "1.0.0"
description = "A comprehensive Python framework for computational experiments in mathematical physics"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Mathematical Physics Research"}
]
keywords = ["mathematics", "physics", "lie-algebras", "quantum-computing", "exceptional-algebras"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0,<3.0",
    "scipy>=1.11.0,<2.0",
    "matplotlib>=3.7.0,<4.0",
    "sympy>=1.12,<2.0",
    "pillow>=10.0.0,<12.0",
    "networkx>=3.1,<4.0",
    "pandas>=2.0.0,<3.0",
    "seaborn>=0.12.0,<1.0",
    "scikit-learn>=1.3.0,<2.0",
    "typing-extensions>=4.12.0,<5.0",
    "jax>=0.4.30,<1.0",
    "pyarrow>=14.0.0,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0",
    "pytest-cov>=4.1.0,<7.0",
    "pytest-xdist>=3.3.0,<4.0",
    "pytest-timeout>=2.1.0,<3.0",
    "coverage[toml]>=7.3.0,<8.0",
    "hypothesis>=6.88.0,<7.0",
]
lint = [
    "ruff>=0.15.22,<0.16.0",
    "mypy==1.19.1",
    "pylint>=3.0.0,<4.0",
    "bandit[toml]>=1.7.5,<2.0",
    "black>=23.9.0,<26.0",
    "isort>=5.12.0,<6.0",
]
viz = [
    "plotly>=5.15.0,<7.0",
    "seaborn>=0.12.0,<1.0",
    "jupyter>=1.0.0,<3.0",
    "ipykernel>=6.25.0,<8.0",
]
quantum = [
    "qiskit>=1.0.0,<2.0",
    "qiskit-aer>=0.13.0,<1.0",
    "qiskit-ibm-runtime>=0.15.0,<1.0",
    "qiskit-experiments>=0.5.0,<1.0",
]
topology = [
    "liesym>=0.8.1,<1.0",
    "gudhi>=3.11.0,<4.0",
    "jaxlie>=1.5.0,<2.0",
    "giotto-tda>=0.1.4,<1.0",
]
performance = [
    "numba>=0.58.0,<1.0",
]
all = [
    "mathphysics-compendium[dev,lint,viz,quantum,topology,performance]",
]

[project.urls]
Homepage = "https://github.com/Oichkatzelesfrettschen/MathScienceCompendium"
Repository = "https://github.com/Oichkatzelesfrettschen/MathScienceCompendium"
Documentation = "https://github.com/Oichkatzelesfrettschen/MathScienceCompendium/tree/main/docs"
Issues = "https://github.com/Oichkatzelesfrettschen/MathScienceCompendium/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mathphysics*"]
namespaces = false

[tool.setuptools.package-data]
mathphysics = ["py.typed"]

# ==============================================================================
# Ruff Configuration - Modern Python Linter
# ==============================================================================
[tool.ruff]
target-version = "py39"
line-length = 100
indent-width = 4

src = ["src", "tests", "benchmarks", "experiments"]
extend-exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "*.egg-info",
    "papers",
    "source_materials",
    "logs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line-too-long (handled by formatter)
    "PLR0913", # too-many-arguments
    "PLR0912", # too-many-branches
    "PLR2004", # magic-value-comparison
    "PLR0915", # too-many-statements
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert usage allowed in tests
    "ARG",     # unused arguments common in pytest fixtures
    "PLR2004", # magic values fine in tests
]
"experiments/**/*.py" = [
    "T201",    # print statements allowed in experiments
]

[tool.ruff.lint.isort]
known-first-party = ["mathphysics"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ==============================================================================
# MyPy Configuration - Static Type Checking
# ==============================================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start lenient, tighten over time
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "matplotlib.*",
    "numba.*",
    "qiskit.*",
    "plotly.*",
    "sympy.*",
    "networkx.*",
    "sklearn.*",
    "liesym.*",
    "gudhi.*",
    "jax",
    "jax.*",
    "jaxlie.*",
]
ignore_missing_imports = true
follow_imports = "skip"

# ==============================================================================
# Coverage Configuration
# ==============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/experiments/*",
    # Qiskit-dependent modules: only testable when qiskit is installed.
    # Excluded so coverage reflects what is actually runnable in CI.
    "*/mathphysics/quantum_e7_circuits.py",
    "*/mathphysics/quantum_e8_circuits.py",
    "*/mathphysics/quantum_encoding.py",
    "*/mathphysics/quantum_simulation.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if 0:",
    "if False:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ==============================================================================
# Bandit Configuration - Security Analysis
# ==============================================================================
[tool.bandit]
targets = ["src"]
exclude_dirs = ["/tests", "/experiments"]
skips = ["B101"]  # assert_used - fine for our use case

# ==============================================================================
# Pylint Configuration
# ==============================================================================
[tool.pylint.main]
py-version = "3.9"
ignore = ["tests", "experiments"]
jobs = 0  # auto-detect CPU count
limit-inference-results = 100
persistent = true
suggestion-mode = true

[tool.pylint.messages_control]
disable = [
    "C0103",  # invalid-name
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0902",  # too-many-instance-attributes
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 100
indent-string = "    "

[tool.pylint.design]
max-args = 10
max-attributes = 15
max-bool-expr = 5
max-branches = 15
max-locals = 20
max-parents = 7
max-public-methods = 25
max-returns = 6
max-statements = 60

# ==============================================================================
# Black Configuration - Code Formatter
# ==============================================================================
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | papers
  | source_materials
)/
'''

# ==============================================================================
# isort Configuration - Import Sorting
# ==============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["mathphysics"]
known_third_party = ["numpy", "scipy", "matplotlib", "sympy", "pytest"]
skip_glob = ["*/venv/*", "*/build/*", "*/dist/*"]
